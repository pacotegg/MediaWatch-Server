name: Build & Release MediaWatch Server

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (core)
        run: npm --prefix core ci

      - name: Download portable FFmpeg for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Descargando FFmpeg portable..."
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force
          $extractedDir = Get-ChildItem -Directory ffmpeg_temp | Select-Object -First 1
          Copy-Item "$($extractedDir.FullName)\bin\ffmpeg.exe" bin\ffmpeg.exe -Force
          Copy-Item "$($extractedDir.FullName)\bin\ffprobe.exe" bin\ffprobe.exe -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_temp
          Write-Host "FFmpeg y FFprobe colocados en bin/"

      - name: Build web & electron
        run: npm run build

      - name: Package installer with electron-builder
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaWatch-Server-Windows
          path: release/*.exe

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (core)
        run: npm --prefix core ci

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libarchive-tools
          mkdir -p bin
          cp $(which ffmpeg) bin/ffmpeg
          cp $(which ffprobe) bin/ffprobe

      - name: Build web & electron
        run: npm run build

      - name: Package installer with electron-builder (AppImage & deb)
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaWatch-Server-Linux
          path: |
            release/*.AppImage
            release/*.deb

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
