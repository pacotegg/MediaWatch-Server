name: Build & Release MediaWatch Server

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (core)
        run: npm --prefix core ci

      - name: Type-check web client
        working-directory: core/web
        run: npx tsc --noEmit

      # FFmpeg fijado: version concreta + SHA256 (el que publica GitHub para ese fichero).
      # Build "essentials" de gyan.dev (GPL v3, con libx264/libx265, QSV, NVENC y AMF).
      # Para subir de version: cambiar $version y $sha256 (gh api repos/GyanD/codexffmpeg/releases/tags/<ver>).
      - name: Download portable FFmpeg for Windows (pinned)
        shell: pwsh
        run: |
          $version = "9.0.2"
          $sha256 = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip"
          Write-Host "Descargando FFmpeg $version..."
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $real = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($real -ne $sha256) { throw "Checksum de FFmpeg no coincide: esperado $sha256, obtenido $real" }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force
          $extractedDir = Get-ChildItem -Directory ffmpeg_temp | Select-Object -First 1
          Copy-Item "$($extractedDir.FullName)\bin\ffmpeg.exe" bin\ffmpeg.exe -Force
          Copy-Item "$($extractedDir.FullName)\bin\ffprobe.exe" bin\ffprobe.exe -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_temp
          Write-Host "FFmpeg y FFprobe colocados en bin/"

      - name: Build web & electron
        run: npm run build

      - name: Package installer with electron-builder
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Comprueba el servidor EMPAQUETADO como lo veria un PC sin Node: con su node.exe y sin Node
      # en el PATH. Es la prueba que habria cazado "Cannot find package 'fastify'".
      - name: Smoke test packaged server (no Node in PATH)
        shell: pwsh
        run: |
          $res = (Resolve-Path "release/win-unpacked/resources").Path
          $env:MEDIAWATCH_DATA_DIR = Join-Path $env:RUNNER_TEMP "mw-smoke"
          $env:MEDIAWATCH_PORT = "8731"
          $env:MEDIAWATCH_HOST = "127.0.0.1"
          $env:PATH = "$env:SystemRoot\System32"
          if (Get-Command node -ErrorAction SilentlyContinue) { throw "node sigue en el PATH: la prueba no sirve" }
          & "$res\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "smoke.out"; $err = Join-Path $env:RUNNER_TEMP "smoke.err"
          $p = Start-Process -FilePath "$res\bin\node.exe" -ArgumentList "src/index.ts" -WorkingDirectory "$res\core\server" -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $ok = (Invoke-RestMethod "http://127.0.0.1:8731/api/salud").ok -eq $true } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue; throw "El servidor empaquetado no respondio en /api/salud" }
          Write-Host "Servidor empaquetado OK"

      # Instala de verdad el .exe (silencioso, «para todos los usuarios»: el runner es administrador) y
      # comprueba lo que el instalador hace: ficheros, regla del cortafuegos, servidor arrancable desde
      # la carpeta instalada sin Node en el PATH, y desinstalacion limpia.
      - name: Install the real installer, check, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw "No hay instalador en release/" }
          $dir = Join-Path $env:RUNNER_TEMP "MWS-instalado"
          Write-Host "Instalando $setup en $dir"
          Start-Process -FilePath $setup -ArgumentList "/S", "/allusers", "/D=$dir" -Wait
          $res = Join-Path $dir "resources"
          foreach ($f in @("bin\node.exe", "bin\ffmpeg.exe", "core\server\src\index.ts", "core\node_modules\fastify\package.json", "core\web\dist\index.html")) {
            if (-not (Test-Path (Join-Path $res $f))) { throw "Falta en la instalacion: $f" }
          }
          netsh advfirewall firewall show rule name="MediaWatch Server" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "El instalador no creo la regla del cortafuegos" }
          Write-Host "Regla del cortafuegos creada:"
          netsh advfirewall firewall show rule name="MediaWatch Server" | Select-String "Rule Name|Enabled|Direction|Action|Program|RemoteIP|Profiles"

          $env:MEDIAWATCH_DATA_DIR = Join-Path $env:RUNNER_TEMP "mw-instalado-datos"
          $env:MEDIAWATCH_PORT = "8732"
          $env:MEDIAWATCH_HOST = "127.0.0.1"
          $env:PATH = "$env:SystemRoot\System32"
          $err = Join-Path $env:RUNNER_TEMP "inst.err"
          $p = Start-Process -FilePath "$res\bin\node.exe" -ArgumentList "src/index.ts" -WorkingDirectory "$res\core\server" -PassThru -WindowStyle Hidden -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $ok = (Invoke-RestMethod "http://127.0.0.1:8732/api/salud").ok -eq $true } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content $err -ErrorAction SilentlyContinue; throw "El servidor instalado no respondio" }
          Write-Host "Servidor instalado OK"

          $un = Join-Path $dir "Uninstall MediaWatch Server.exe"
          if (-not (Test-Path $un)) { throw "No hay desinstalador" }
          Start-Process -FilePath $un -ArgumentList "/S", "/allusers", "_?=$dir" -Wait
          netsh advfirewall firewall show rule name="MediaWatch Server" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "La desinstalacion no quito la regla del cortafuegos" }
          Write-Host "Desinstalacion OK: la regla del cortafuegos ya no existe"
          # El ultimo netsh «fallo» a proposito (la regla ya no existe) y pwsh devolveria su codigo de salida.
          $global:LASTEXITCODE = 0

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaWatch-Server-Windows
          path: release/*.exe

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (core)
        run: npm --prefix core ci

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libarchive-tools
          mkdir -p bin
          cp $(which ffmpeg) bin/ffmpeg
          cp $(which ffprobe) bin/ffprobe

      - name: Build web & electron
        run: npm run build

      - name: Package installer with electron-builder (AppImage & deb)
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaWatch-Server-Linux
          path: |
            release/*.AppImage
            release/*.deb

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
